<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="statusboard">
<title>statusboard</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03111f"/><stop offset="1" stop-color="#0b3954"/></linearGradient>
<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4cc9f0"/><stop offset="1" stop-color="#7ae582"/></linearGradient>
<clipPath id="rc"><rect width="900" height="200" rx="16"/></clipPath>
</defs>
<g clip-path="url(#rc)">
<rect width="900" height="200" fill="url(#bg)"/>
<circle cx="450" cy="170" r="10" fill="#7ae582"><animate attributeName="r" values="4;10;4" dur="1.5s" repeatCount="indefinite"/></circle>
<circle cx="450" cy="170" r="10" fill="none" stroke="#7ae582" stroke-width="2"><animate attributeName="r" values="6;60" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/></circle>
<path d="M0,170 H390 l12,-34 l16,68 l14,-50 l8,16 H900" fill="none" stroke="#4cc9f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" opacity=".8"><animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;.6;1" dur="3.2s" repeatCount="indefinite"/></path>
<text x="450" y="92" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="62" font-weight="700" fill="url(#tx)" opacity="0">statusboard<animate attributeName="opacity" from="0" to="1" dur=".9s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur=".9s" fill="freeze"/></text>
<text x="450" y="128" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="20" fill="#7ae582" opacity="0">live uptime cards for your README<animate attributeName="opacity" from="0" to=".9" begin=".7s" dur=".9s" fill="freeze"/></text>
</g>
</svg>
